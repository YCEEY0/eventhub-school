<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventHub School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <strong class="logo" data-i18n="brand">EventHub School</strong>
    <nav>
      <a href="index.html" class="active" data-i18n="navHome">Събития</a>
      <a href="pages/add-event.html" data-i18n="navAdd">Добави събитие</a>
      <button id="languageToggle" type="button" class="lang-btn">EN</button>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-i18n="heroTitle">Предстоящи училищни събития</h1>
      <p data-i18n="heroSubtitle">Разгледай календара, филтрирай по категория и се запиши с един клик.</p>
    </section>

    <section class="filters">
      <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Търси събитие..." />
      <select id="categoryFilter">
        <option value="all" data-i18n="allCategories">Всички категории</option>
        <option value="tech" data-i18n="catTech">Технологии</option>
        <option value="culture" data-i18n="catCulture">Култура</option>
        <option value="sport" data-i18n="catSport">Спорт</option>
      </select>
    </section>

    <section id="eventsList" class="grid"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
